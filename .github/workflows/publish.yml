name: publish

# Publishes to npm when a version tag is pushed.
#
# This uses npm Trusted Publishing (OIDC), so no token is stored in the
# repository, in GitHub secrets, or on anyone's laptop. It also avoids the
# 2FA-bypass path that npm is retiring for direct publishes.
#
# One-time setup, on npmjs.com:
#   the package → Settings → Trusted Publisher → GitHub Actions
#     Organization or user: Inceptzws
#     Repository:           dsh-project-guard
#     Workflow filename:    publish.yml
#     Environment:          (leave empty)
#
# Releasing then is: bump "version" in package.json, commit, push a matching
# tag (v1.1.0), and this workflow verifies and publishes.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm; the runner image may lag.
      - name: Use the latest npm
        run: npm install --global npm@latest

      # On a tag push the tag must name the version; a manual run (used to
      # retry after the trusted publisher was bound late) publishes whatever
      # package.json says.
      - name: The tag must match package.json
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$pkg" ]; then
              echo "tag v$tag does not match package.json version $pkg" >&2
              exit 1
            fi
          else
            echo "manual run: publishing package.json version $pkg"
          fi

      - name: Run the test suite
        run: node --test test/*.test.mjs

      # The rule set is read from disk at runtime, so a tarball without
      # rules/consequences.yml would install a plugin with no rules at all.
      - name: The tarball must ship the rule set
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          grep -q 'rules/consequences.yml' /tmp/pack.txt

      - name: Publish
        run: npm publish --provenance --access public
