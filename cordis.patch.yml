# Project guard — the profile row.
#
# Inserted after every bundle layer. Edit the config here; the values below are
# the shipped defaults for this machine.
- insert:
    - id: project-guard
      name: dsh-project-guard
      config:
        # Master switch. Set to false to hand control back to the normal
        # sandbox/approval behaviour without removing the package.
        enabled: true
        # Extra project roots. Change this to your own project parent: the
        # session workspace (its cwd) is already a root whenever
        # includeSessionCwd is true, so this entry only widens the scope to the
        # sibling projects next to it.
        projectRoots:
          - ~/Documents/deepseek-harness
        includeSessionCwd: true
        # Roots that may be read but never written. Add the Harness install
        # directory here if reading its sources should not prompt:
        #   - /Applications/DeepSeek Harness.app
        readOnlyRoots: []
        # Scratch space. The host sandbox already treats it as writable.
        includeTempDirs: true
        # Keep the session on the `ask` approval policy so confirmations can
        # actually reach the user. Under `never` every request is rejected
        # before any answerer runs and no prompt can appear.
        enforceAskPolicy: true
        # The guard never changes the session's sandbox mode: whatever you pick
        # in the permission selector is what you get. It only decides what has to
        # be asked when a call wants more than that.
        #
        # Writable roots outside the project: package caches, alongside the
        # platform temp area. Empty means the built-in list (~/.npm,
        # ~/Library/Caches, ~/.cargo, ...).
        cacheRoots: []
        # Only one confirmation outstanding at a time; system-related requests
        # take the single slot first.
        serializeApprovals: true
        prioritizeSystemRequests: true
        # Refuse actions that would damage the machine or cut this session
        # (disk formatting, deleting from `/`, power off, Wi-Fi off, killing
        # core system processes). Set false to downgrade them to confirmations.
        protectSessionAndSystem: true
        resolveSymlinks: true
        # `python -c`, `node -e`, `$(...)`, `eval` and similar uninspectable
        # text ask first. Set true to let them run inside the project.
        allowInlineCode: false
        # Extra tools to always allow / always ask about / deny.
        allowTools: []
        askTools: []
        denyTools: []
        # Extra system program names and regular expressions.
        systemCommands: []
        extraAskPatterns: []
        extraAllowPatterns: []
        # ── Consequence disclosure layer ────────────────────────────────────
        # `Decision-Relevant Consequence Disclosure in Complex Computing
        # Systems`. On top of the permission decision above, the rule set in
        # rules/consequences.yml predicts what an action costs the user, shows a
        # Preview inside the confirmation prompt, and appends a Report to the
        # tool result when an action ran without one. Set false for the
        # permission gate alone.
        disclose: true
        # Most consequences shown for one decision (the paper's budget k), and
        # the relevance threshold τ below which nothing is disclosed at all.
        attentionBudget: 2
        relevanceThreshold: 0.15
        # Observed-vs-predicted records, relative to the workspace. These are the
        # calibration evidence the paper's evaluation consumes; they hold action
        # types, paths and verdicts, never file contents.
        reportDir: .dsh-project-guard
        # Declared interest weights (0-1) for the selection rule
        # r(e) = w_j · l_j(e) · κ_e · ν_e. Anything omitted keeps its default:
        #   data_work 1.0 · availability 0.9 · environment 0.8 ·
        #   authority_delegation 0.7 · economic 0.6 · privacy 0.5
        # For example, to say "privacy matters as much as my work here":
        #   interests:
        #     privacy: 1.0
        interests: {}
        # Use a different rule set than the shipped one.
        rulesFile: ""
        verbose: false
